# Only this vhost uses these variables/zones. Empty keys are not rate limited.
map $request_method $spectre_write_key_v2 {
    default $binary_remote_addr;
    GET "";
    HEAD "";
}
map $request_method $spectre_read_key_v2 {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
}
limit_req_zone $spectre_write_key_v2 zone=spectre_write_v2:10m rate=30r/m;
limit_req_zone $spectre_read_key_v2 zone=spectre_read_v2:10m rate=180r/m;
limit_conn_zone $binary_remote_addr zone=spectre_conn_v2:1m;
# Deliberately omit IPs, query strings, bodies, cookies and capability headers.
log_format spectre_minimal '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
